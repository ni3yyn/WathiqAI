            <div class="floating-input-wrap animate-fade-in">
                <!-- Selected photos remain visible here until the user sends the message. -->
                <div id="photoPreviewBar" class="photo-preview-bar" style="display:none;" aria-live="polite" aria-label="الصور المرفقة"></div>
                <form id="chatForm" class="floating-pill">
                    
                    <button 
                        type="button" 
                        id="micBtn" 
                        onclick="toggleVoiceInput()" 
                        class="pill-icon-btn" 
                        title="إملاء صوتي"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-mic"/></svg>
                    </button>

                    <!-- Explicit image attach control. Events are wired in chat-interactions.js after this fragment mounts. -->
                    <input type="file" id="photoFileInput" class="photo-file-input"
                        accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple
                        aria-label="اختيار صور المنتج">
                    <button
                        type="button"
                        id="photoBtn"
                        class="pill-icon-btn photo-attach-btn"
                        title="إرفاق صورة المنتج أو قائمة المكونات"
                        aria-label="إرفاق صورة"
                        aria-controls="photoFileInput"
                    >
                        <svg aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        <span class="photo-attach-label">إرفاق صورة</span>
                    </button>

                    <textarea 
                        id="messageInput" 
                        placeholder="اسأل وثيق عن منتج، ماركة..."
                        class="auto-textarea flex-1 min-w-0"
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button 
                        type="button" 
                        id="clearInputBtn" 
                        onclick="clearInputField()" 
                        class="pill-icon-btn hidden" 
                        title="مسح النص"
                        style="width:30px; height:30px; margin-bottom:5px;"
                    >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#i-x"/></svg>
                    </button>

                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="send-pill-btn"
                        title="إرسال"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-send"/></svg>
                    </button>
                </form>
            </div>
