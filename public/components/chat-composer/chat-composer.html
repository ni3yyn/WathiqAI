            <div class="floating-input-wrap animate-fade-in">
                <!-- Photo preview bar (injected by JS when photo selected) -->
                <div id="photoPreviewBar" style="display:none;"></div>
                <form id="chatForm" class="floating-pill">
                    
                    <button 
                        type="button" 
                        id="micBtn" 
                        onclick="toggleVoiceInput()" 
                        class="pill-icon-btn" 
                        title="إملاء صوتي"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-mic"/></svg>
                    </button>

                    <!-- Photo attach -->
                    <input type="file" id="photoFileInput" accept="image/*" style="display:none;"
                        onchange="if(this.files[0]) handlePhotoAttach(this.files[0]); this.value='';">
                    <button 
                        type="button" 
                        id="photoBtn"
                        onclick="document.getElementById('photoFileInput').click()"
                        class="pill-icon-btn"
                        title="إرفاق صورة"
                        style="opacity:0.65;"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </button>

                    <textarea 
                        id="messageInput" 
                        placeholder="اسأل وثيق عن منتج، ماركة..."
                        class="auto-textarea flex-1 min-w-0"
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button 
                        type="button" 
                        id="clearInputBtn" 
                        onclick="clearInputField()" 
                        class="pill-icon-btn hidden" 
                        title="مسح النص"
                        style="width:30px; height:30px; margin-bottom:5px;"
                    >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#i-x"/></svg>
                    </button>

                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="send-pill-btn"
                        title="إرسال"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-send"/></svg>
                    </button>
                </form>
            </div>
